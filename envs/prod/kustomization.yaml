# Environnement PROD – déployé par Argo CD (ApplicationSet portfolio)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portfolio-prod
resources:
  - namespace.yaml
  - ../../base
labels:
  - pairs: { environment: prod }
    includeSelectors: false
replicas:
  - name: frontend
    count: 3
  - name: api
    count: 3
# Images de Harbor, signées, fixées par DIGEST (le tag sert seulement de repère)
images:
  - name: devsecops-api
    newName: localhost:8090/devsecops/devsecops-api
    newTag: "59de555"
    digest: sha256:b28e027cdd33f76fe2e2503cbf8e16d8f56c5fc81afc538e8f7229e152bc0f58
  - name: devsecops-portfolio
    newName: localhost:8090/devsecops/devsecops-portfolio
    newTag: "59de555"
    digest: sha256:7abb321fa74f340b80b944538ae9f22d90e239ffcd95d1d09a67115eb77e51fe
configMapGenerator:
  - name: frontend-config
    behavior: merge
    literals:
      - API_URL=http://api.portfolio-prod.svc.cluster.local:4000
  - name: api-config
    behavior: merge
    literals:
      - CORS_ORIGIN=http://prod.portfolio.local:8088,http://prod.portfolio.local
patches:
  - target: { kind: Ingress, name: portfolio }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: prod.portfolio.local
  # PROD : limites de ressources plus élevées pour l'API
  - target: { kind: Deployment, name: api }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 384Mi
