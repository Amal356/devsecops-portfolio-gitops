# Environnement STAGING – déployé par Argo CD (ApplicationSet portfolio)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portfolio-staging
resources:
  - namespace.yaml
  - ../../base
labels:
  - pairs: { environment: staging }
    includeSelectors: false
replicas:
  - name: frontend
    count: 2
  - name: api
    count: 2
# Images de Harbor, signées, fixées par DIGEST (le tag sert seulement de repère)
images:
  - name: devsecops-api
    newName: localhost:8090/devsecops/devsecops-api
    newTag: "c70a5e6"
    digest: sha256:e1eb186eb9d9dc091991b7a0ea9b8d52bef8ccb05e103561287ed4eefa746cbc
  - name: devsecops-portfolio
    newName: localhost:8090/devsecops/devsecops-portfolio
    newTag: "c70a5e6"
    digest: sha256:8da2dd74c44f6de0ff25a06cc77b350b9c4cb1c45e15a753b7f38cc408d5163c
configMapGenerator:
  - name: frontend-config
    behavior: merge
    literals:
      - API_URL=http://api.portfolio-staging.svc.cluster.local:4000
  - name: api-config
    behavior: merge
    literals:
      - CORS_ORIGIN=http://staging.portfolio.local:8088,http://staging.portfolio.local
patches:
  - target: { kind: Ingress, name: portfolio }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.portfolio.local
