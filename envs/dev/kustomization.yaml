# Environnement DEV – déployé automatiquement par Argo CD (Application portfolio-dev)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portfolio-dev
resources:
  - namespace.yaml
  - ../../base
labels:
  - pairs: { environment: dev }
    includeSelectors: false
replicas:
  - name: frontend
    count: 1
  - name: api
    count: 2
# Images de Harbor, signées, fixées par DIGEST (le tag sert seulement de repère)
images:
  - name: devsecops-api
    newName: localhost:8090/devsecops/devsecops-api
    newTag: "59de555"
    digest: sha256:b28e027cdd33f76fe2e2503cbf8e16d8f56c5fc81afc538e8f7229e152bc0f58
  - name: devsecops-portfolio
    newName: localhost:8090/devsecops/devsecops-portfolio
    newTag: "59de555"
    digest: sha256:7abb321fa74f340b80b944538ae9f22d90e239ffcd95d1d09a67115eb77e51fe
configMapGenerator:
  - name: frontend-config
    behavior: merge
    literals:
      - API_URL=http://api.portfolio-dev.svc.cluster.local:4000
      # Activité 9, partie 50 : connexion OIDC (Keycloak) activée en DEV uniquement
      - APP_URL=http://dev.portfolio.local:8088
      - KEYCLOAK_PUBLIC_URL=http://keycloak.local:8088
      - KEYCLOAK_INTERNAL_URL=http://keycloak.keycloak.svc.cluster.local:8080
      - OIDC_REALM=portfolio
      - OIDC_CLIENT_ID=portfolio-web
  - name: api-config
    behavior: merge
    literals:
      - CORS_ORIGIN=http://dev.portfolio.local:8088,http://dev.portfolio.local
      # Activité 9, partie 50 : vérification des jetons Keycloak par l'API
      - OIDC_ISSUER=http://keycloak.local:8088/realms/portfolio
      - OIDC_JWKS_URL=http://keycloak.keycloak.svc.cluster.local:8080/realms/portfolio/protocol/openid-connect/certs
      - OIDC_AUDIENCE=portfolio-api
patches:
  - target: { kind: Ingress, name: portfolio }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.portfolio.local
