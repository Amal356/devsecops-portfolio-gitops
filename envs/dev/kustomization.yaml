# Environnement DEV – déployé automatiquement par Argo CD (Application portfolio-dev)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portfolio-dev
resources:
  - namespace.yaml
  - ../../base
labels:
  - pairs: { environment: dev }
    includeSelectors: false
replicas:
  - name: frontend
    count: 1
  - name: api
    count: 2
# Images de Harbor, signées, fixées par DIGEST (le tag sert seulement de repère)
images:
  - name: devsecops-api
    newName: localhost:8090/devsecops/devsecops-api
    newTag: "6ef45e4"
    digest: sha256:3881737d91fe52de914b0e0d28d97824f02109b4cb1d34047a8774469d12dc13
  - name: devsecops-portfolio
    newName: localhost:8090/devsecops/devsecops-portfolio
    newTag: "6ef45e4"
    digest: sha256:747abf094e117ff813f8f6a0076e4ef03faaffaa5d064557ae5f333913ef00da
configMapGenerator:
  - name: frontend-config
    behavior: merge
    literals:
      - API_URL=http://api.portfolio-dev.svc.cluster.local:4000
  - name: api-config
    behavior: merge
    literals:
      - CORS_ORIGIN=http://dev.portfolio.local:8088,http://dev.portfolio.local
patches:
  - target: { kind: Ingress, name: portfolio }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.portfolio.local
