# Base commune à tous les environnements (dépôt GitOps surveillé par Argo CD)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs: { app.kubernetes.io/part-of: devsecops-portfolio }
    includeSelectors: false
resources:
  - serviceaccount.yaml
  - postgres.yaml
  - api.yaml
  - frontend.yaml
  - ingress.yaml
  - migration-job.yaml          # étape 218 : hook Argo CD PreSync
configMapGenerator:
  - name: api-config
    literals:
      - NODE_ENV=production
      - PORT=4000
      - CORS_ORIGIN=http://portfolio.local
      - CHECKPOINT_DISABLE=1
      - HOME=/tmp
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo.monitoring.svc.cluster.local:4318
      - OTEL_SERVICE_NAME=devsecops-api
  - name: frontend-config
    literals:
      - API_URL=http://api:4000
      - NEXT_TELEMETRY_DISABLED=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo.monitoring.svc.cluster.local:4318
      - OTEL_SERVICE_NAME=devsecops-portfolio
